<!DOCTYPE html>
<html>
<head>
<style>
.none {
  display: none;
}

.visible {
  display: block;
  background-color: tomato;
  padding: 10px;
  margin: 10px;
}
</style>
</head>
<body>

<h3>display: none</h3>
<div class="none">நான் மறைஞ்சிருவேன் 😊</div>
<div class="visible">நான் தெரிவேன் 😃</div>

<h3>என்ன நடக்கும்:</h3>
<ul>
  <li>`display: none` கொடுத்தா element மொத்தமா மறைஞ்சிடும்</li>
  <li>அந்த space-ல வேற எந்த element-ம் வந்துடும்</li>
  <li>`visibility: hidden` கொடுத்தா space-ல இருக்கும், ஆனா தெரியாது</li>
</ul>

</body>
</html>
