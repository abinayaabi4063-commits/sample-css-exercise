<!DOCTYPE html>
<html>
<head>
<style>
.box {
  width: 200px;
  height: 200px;
  margin: 10px;
  color: white;
  text-align: center;
  padding: 20px;
}
.bg-example {
  background-color: tomato;
}
.bg-image {
  background-image: url('https://picsum.photos/200');
  background-size: cover;
}
.bg-gradient {
  background: linear-gradient(to right, tomato, gold);
}
</style>
</head>
<body>
<h3>Background Expl</h3>
<div class="box bg-example">Color 😊</div>
<div class="box bg-image">Image 😊</div>
<div class="box bg-gradient">Gradient 😊</div>
<h3>Properties</h3>
<ul>
  <li>`background-color`: size,img,gradient
    
  </li>
  </ul>
</body>
</html>
