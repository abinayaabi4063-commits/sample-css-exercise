<!DOCTYPE html>
<html>
<head>
<style>
.box {
  width: 100px;
  height: 100px;
  position: absolute;
}
.box1 {
  background-color: tomato;
  top: 50px;
  left: 50px;
  z-index:1; 
}
.box2 {
  background-color: skyblue;
  top: 100px;
  left: 50px;
  z-index:4; 
}
.box3 {
  background-color: lightgreen;
  top: 150px;
  left: 50px;
  z-index: 3; 
}
</style>
</head>
<body>
<div class="box box1">index: 1</div>
<div class="box box2">index: 2</div>
<div class="box box3">index: 3</div>
</body>
</html>
