<!DOCTYPE html>
<html>
<head>
<style>
.container {
  display: flex;
background-color:light grey ;
  padding: 50px;
  margin-bottom: 25px;
}
.item {
  background-color: dodgerblue;
  color: white;
  padding: 20px;
  text-align: center;
}
.gap-10 {
  gap: 10px;
}
.gap-20 {
  gap: 20px;
}
.gap-row-col {
  gap: 10px 30px; 
}
</style>
</head>
<body>
<h3>gap 20px</h3>
<div class="container gap-20">
  <div class="item">1</div>
  <div class="item">2</div>
  <div class="item">3</div>
</div>
<h3>gap 10px 30px row column</h3>
<div class="container gap-row-col">
  <div class="item">1</div>
  <div class="item">2</div>
  <div class="item">3</div>
</div>
</body>
</html>
