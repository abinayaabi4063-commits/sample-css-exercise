<!DOCTYPE html>
<html>
<head>
<style>
.border-example {
  border: 2px solid tomato; 
  padding: 20px;
  margin: 10px;
  width:100px;
  text-align: center;
}
.border-types {
  padding: 20px;
  margin: 10px;
  width: 100px;
  text-align: center;
}
.solid { border: 2px solid black; }
.dotted { border: 2px dotted blue; }
.dashed { border: 2px dashed green; }
.double { border: 4px double red; }
</style>
</head>
<body>
<h3>Border Example</h3>
<div class="border-example">abinaya</div>
<h3>Border Types</h3>
<div class="border-types solid">Sp</div>
<div class="border-types dotted">DB</div>
<div class="border-types dashed">Db</div>
<div class="border-types double">2b</div>
<h3>Properties</h3>
<ul>
  <li>border width-thickness</li>
  <li>border style-solid/dotted/dashed/double</li>
  <li>border color-color</li>
  <li>Shortcut border-2px solid red;</li>
</ul>
</body>
</html>
