<!DOCTYPE html>
<html>
<head>
<style>
.box {
  width: 100px;
  padding: 20px;
  border: 1px solid black;
  margin: 10px;
}
.content-box {
  box-sizing: content-box; 
  background-color: rgb(175, 187, 66);
}
.border-box {
  box-sizing: border-box;
  background-color: rgb(80, 161, 48);
  color: white;
}
</style>
</head>
<body>
<h3>Box Sizing</h3>
<div class="box content-box">
  abinaya
</div>
<div class="box border-box">
  abinaya velmurugan
</div>
</body>
</html>
