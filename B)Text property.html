<!DOCTYPE html>
<html>
<head>
<style>
.text-example {
  color: tomato;
  text-align: center; 
  text-decoration: underline; 
  text-transform: uppercase;
  letter-spacing: 2px; 
  line-height: 1.5; 
}
</style>
</head>
<body>
<h3>Text Properties </h3>
<p class="text-example">
  abinaya velmurugan
</p>
<h3>Properties </h3>
<ul>
  <li>color- Text color</li>
  <li>text align- left/center/right</li>
  <li>text decoration- underline/overline/line-through</li>
  <li>text transform- uppercase/lowercase/capitalize</li>
  <li>letter spacing- letter space</li>
  <li>line height- line space</li>
</ul>
</body>
</html>
