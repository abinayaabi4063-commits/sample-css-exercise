<!DOCTYPE html>
<html>
<head>
<style>
.box {
  background-color: lightblue;
  padding: 20px;
  text-align: center;
}
.margin-example {
  margin:100px; 
  background-color: tomato;
  color: white;
}
</style>
</head>
<body>
<h3>Margin Example</h3>
<div class="box"> normal box</div>
<div class="box margin-example"> margin box</div>
<h3>works</h3>
<ul>
  <li>margin: 20px = all sides 20px</li>
  <li>margin: 10px 20px = top-bottom 10px, left-right 20px</li>
  <li>margin: 10px 20px 30px 40px = top,right,bottom,left</li>
</ul>
</body>
</html>
